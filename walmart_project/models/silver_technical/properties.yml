models:
    - name: products_t
      columns:
        - name: product_id
          tests:
            - not_null
            - unique:
                config:
                    where: "price > 0"

            
    - name: orders_t
      columns:
        - name: order_id
          tests:
            - not_null
            - unique
        - name: customer_id
          tests:
            - not_null